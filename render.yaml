databases:
  - name: todo-db
    plan: free

services:
  - type: web
    name: todo-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
